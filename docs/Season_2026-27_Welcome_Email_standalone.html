document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\" xmlns=\"http://www.w3.org/1999/xhtml\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"color-scheme\" content=\"light dark\">\n<meta name=\"supported-color-schemes\" content=\"light dark\">\n<title>Welcome to Season 2026–27</title>\n<!--[if mso]><style>table{border-collapse:collapse;}td{mso-line-height-rule:exactly;}</style><![endif]-->\n<style>\n  @media only screen and (max-width:620px){\n    .stack{display:block !important;width:100% !important;}\n    .px{padding-left:24px !important;padding-right:24px !important;}\n  }\n</style>\n</head>\n\n<body style=\"margin:0;padding:0;background-color:#DCDDDE;\">\n<span style=\"display:none;font-size:1px;color:#DCDDDE;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;\">Take the break. Meet the board. Save the dates. Then we go again.</span>\n<table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#DCDDDE;\">\n<tbody><tr><td align=\"center\" style=\"padding:24px 12px;\">\n<!--[if mso]><table role=\"presentation\" width=\"600\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr><td><![endif]-->\n<table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" style=\"width:600px;max-width:600px;\">\n\n  <!-- Progress flag rule -->\n  <tbody><tr><td>\n    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n      <tbody><tr>\n        <td width=\"55\" height=\"8\" style=\"background-color:#000000;font-size:1px;line-height:1px;\">&nbsp;</td>\n        <td width=\"55\" height=\"8\" style=\"background-color:#613915;font-size:1px;line-height:1px;\">&nbsp;</td>\n        <td width=\"54\" height=\"8\" style=\"background-color:#74D7EE;font-size:1px;line-height:1px;\">&nbsp;</td>\n        <td width=\"55\" height=\"8\" style=\"background-color:#FFAFC8;font-size:1px;line-height:1px;\">&nbsp;</td>\n        <td width=\"54\" height=\"8\" style=\"background-color:#FFFFFF;font-size:1px;line-height:1px;\">&nbsp;</td>\n        <td width=\"55\" height=\"8\" style=\"background-color:#E40303;font-size:1px;line-height:1px;\">&nbsp;</td>\n        <td width=\"54\" height=\"8\" style=\"background-color:#FF8C00;font-size:1px;line-height:1px;\">&nbsp;</td>\n        <td width=\"55\" height=\"8\" style=\"background-color:#FFED00;font-size:1px;line-height:1px;\">&nbsp;</td>\n        <td width=\"54\" height=\"8\" style=\"background-color:#008026;font-size:1px;line-height:1px;\">&nbsp;</td>\n        <td width=\"55\" height=\"8\" style=\"background-color:#004DFF;font-size:1px;line-height:1px;\">&nbsp;</td>\n        <td width=\"54\" height=\"8\" style=\"background-color:#750787;font-size:1px;line-height:1px;\">&nbsp;</td>\n      </tr>\n    </tbody></table>\n  </td></tr>\n\n  <!-- Masthead — SWAP the logo src for a hosted https URL before sending -->\n  <tr><td class=\"px\" style=\"background-color:#00243C;padding:36px 40px 32px 40px;\" align=\"center\">\n    <img src=\"e38af544-3d59-4a17-94cf-cc4e8fb94af2\" width=\"300\" height=\"100\" alt=\"San Francisco Fog Rugby Football Club\" style=\"display:block;width:300px;height:100px;border:0;outline:none;text-decoration:none;\">\n    <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:14px;line-height:20px;letter-spacing:2px;color:#24A0F1;padding-top:18px;\">SEASON 2026–27 KICKOFF</div>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:18px;line-height:24px;letter-spacing:1.5px;color:#006EB6;border-bottom:1px solid #DCDDDE;padding-bottom:10px;\">FIRST THINGS FIRST: TAKE THE BREAK</div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:16px;\">\n      What a season. A NorAm title, a huge Fog contingent in Brisbane for Bingham Cup 2026, and a club that's bigger, louder and more welcoming than it's ever been. You earned this. So for the next few weeks the only instruction from the board is: <span style=\"font-weight:bold;\">rest, recover, recruit.</span> Sleep in. See the people you've been neglecting since March. Go somewhere that isn't Crocker.\n    </div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:12px;\">\n      It's a short break, though. Kangaroo Court sits <span style=\"font-weight:bold;\">Sep 13</span>, Pathways starts <span style=\"font-weight:bold;\">Oct 6</span>, preseason practice is back <span style=\"font-weight:bold;\">Oct 29</span>, and everything you need to know between now and May is below. Read it once, save the dates, and then go back to doing nothing.\n    </div>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n      <tbody><tr><td style=\"border-left:4px solid #006EB6;padding:6px 0 6px 24px;\">\n        <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:16px;line-height:22px;letter-spacing:1.5px;color:#00243C;\">THANK YOU, ZACK</div>\n        <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:12px;\">\n          Before we look forward, a proper thank you to <span style=\"font-weight:bold;\">Zack Forcum</span>, who has handed over the presidency after steering the Fog through a NorAm title, a tour to the other side of the world, and about a thousand small things nobody sees. Zack, the club is in better shape than you found it. That's the whole job, and you did it.\n        </div>\n        <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:12px;\">\n          Thanks too to the board members stepping down: <span style=\"font-weight:bold;\">Xander</span> (recruiting, and all-round glue), <span style=\"font-weight:bold;\">Johnny Galang</span> (fundraising, and the scholarships it paid for), <span style=\"font-weight:bold;\">Mitch Croll</span> (leadership in more roles than we can list) and <span style=\"font-weight:bold;\">Garrett Mack</span> (the marketing and socials that brought half of you here in the first place). None of them are going anywhere — they're just not on the board. Buy them a beer.\n        </div>\n      </td></tr>\n    </tbody></table>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:18px;line-height:24px;letter-spacing:1.5px;color:#006EB6;border-bottom:1px solid #DCDDDE;padding-bottom:10px;\">YOUR 2026–27 BOARD</div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:16px;\">\n      Here's who's running the show this year. Photos from the 2026 Fog Photofest. Every one of these people volunteered for this — if you've got an idea, a problem, or a spare Saturday, they're your first call.\n    </div>\n    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"margin-top:4px;\">\n      <tbody>\n      <tr>\n        <td class=\"stack\" width=\"260\" valign=\"top\" style=\"padding-top:20px;\">\n          <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tbody><tr>\n            <td width=\"100\" valign=\"top\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAD6AMgDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABQIDBA 00\" height=\"125\" alt=\"Luke Kushner\" style=\"display:block;width:100px;height:125px;border:0;border-radius:3px;\"></td>\n            <td valign=\"middle\" style=\"padding-left:14px;\">\n              <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;font-weight:bold;\">Luke Kushner</div>\n              <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;letter-spacing:1px;color:#006EB6;\">GAME DAY SOCIALS</div>\n            </td>\n          </tr></tbody></table>\n        </td>\n      </tr>\n    </tbody></table>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#141718;padding-top:16px;\">Fernando and Mike's headshots are on the way — they'll be up on the squad page shortly.</div>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:18px;line-height:24px;letter-spacing:1.5px;color:#006EB6;border-bottom:1px solid #DCDDDE;padding-bottom:10px;\">THE YEAR AHEAD</div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:16px;\">\n      Same club, bigger ambitions. The board's focus for 2026–27, in plain terms:\n    </div>\n    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n      <tbody>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">GROW</td>\n        <td valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">Get more people playing. Pathways to Rugby runs on the <span style=\"font-weight:bold;\">EVERY. BODY.</span> platform — positions for every body, no experience needed. Bring a mate.</td>\n      </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">COMPETE</td>\n        <td valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">A full NCRFU Tier 3 season from February, then IGR NorAm 2027 in New Orleans over Memorial Day weekend.</td>\n      </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">FUND</td>\n        <td valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">Three big volunteer-run fundraisers this fall, plus sponsorships that keep dues down and scholarships open.</td>\n      </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">RUN WELL</td>\n        <td valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">Tighter ops and kit, a refreshed website, and a members' system so the club runs on more than group chats.</td>\n      </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">CARE</td>\n        <td valign=\"top\" style=\"padding:14px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">Pre-hab, welfare, and a culture where the newest rookie is treated like a Bingham veteran.</td>\n      </tr>\n    </tbody></table>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#141718;padding-top:10px;\">We'll report back on all five at the mid-season check-in. Hold us to it.</div>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n      <tbody><tr><td style=\"border-left:4px solid #006EB6;padding:6px 0 6px 24px;\">\n        <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:16px;line-height:22px;letter-spacing:1.5px;color:#00243C;\">YOU'RE SUMMONED: KANGAROO COURT &amp; BEACH BASH</div>\n        <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:12px;\">\n          <span style=\"font-weight:bold;\">Sunday Sep 13, Ocean Beach, from 3pm.</span> Come hang from 3 for some beach touch, then at <span style=\"font-weight:bold;\">5pm the Court is in session</span> — the Honorable Ratty Ratcliffe presiding. Every grievance you've been sitting on since Brisbane will be heard. Verdicts are final. Appeals are ignored.\n        </div>\n        <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:12px;\">\n          After sentencing, potluck dinner on the sand until about 8. Bring a dish if you can, a towel either way, and anyone you want to introduce to the club — partners, rookies and Pathways-curious mates all welcome.\n        </div>\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-top:18px;\">\n          <tbody><tr><td style=\"background-color:#00 5px;line-height:20px;color:#141718;\"><span style=\"font-weight:bold;\">Tournament day</span> — coffee from 7am, kickoff 8am, rugby all day, free concessions, 4:30pm awards, 9pm official after-party at Rich's.</td>\n      </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">SUN DEC 6</td>\n        <td valign=\"top\" style=\"padding:14px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">Survivors' brunch at Uptown Tavern, 10am. Final goodbye drinks at Number One on Fifth, noon.</td>\n      </tr>\n    </tbody></table>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#141718;padding-top:10px;\">The new board meets for the first time this coming <span style=\"font-weight:bold;\">Tuesday Sep 8</span>, and RuckTacular logistics — travel, accommodation, cost and sign-up — are top of the agenda. Full details out soon after. For now: block the weekend.</div>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:18px;line-height:24px;letter-spacing:1.5px;color:#006EB6;border-bottom:1px solid #DCDDDE;padding-bottom:10px;\">2027 LEAGUE SEASON — NCRFU TIER 3</div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:16px;\">\n      Here's the shape of the spring. Kickoff times and pitches will follow. As always with NorCal rugby, there's a chance something moves — we'll keep you posted.\n    </div>\n    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n      <tbody>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:       </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">APR 10</td>\n        <td valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">SF Fog vs Stanislaus Harlots &nbsp;<span style=\"display:inline-block;background-color:#00243C;color:#FEFEFE;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;letter-spacing:1px;font-weight:bold;padding:2px 8px;border-radius:2px;\">HOME</span></td>\n      </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">APR 17</td>\n        <td valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">Marin vs SF Fog &nbsp;<span style=\"display:inline-block;background-color:#DCDDDE;color:#00243C;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;letter-spacing:1px;font-weight:bold;padding:2px 8px;border-radius:2px;\">AWAY</span></td>\n      </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">APR 24</td>\n        <td valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">Chico vs SF Fog &nbsp;<span style=\"display:inline-block;background-color:#DCDDDE;color:#00243C;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;letter-spacing:1px;font-weight:bold;padding:2px 8px;border-radius:2px;\">AWAY</span></td>\n      </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">MAY 8</td>\n        <td valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">NCRFU Semifinals, if qualified — location TBD</td>\n      </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">MAY 15</td>\n        <td valign=\"top\" style=\"padding:14px 0;border-bottom:1px solid #DCDDDE;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">NCRFU Finals, if qualified — location TBD</td>\n      </tr>\n      <tr>\n        <td width=\"90\" valign=\"top\" style=\"padding:14px 0;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:20px;letter-spacing:1px;color:#00243C;\">MAY 28–31</td>\n        <td valign=\"top\" style=\"padding:14px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:20px;color:#141718;\">IGR NorAm 2027 — New Orleans (Memorial Day weekend)</td>\n      </tr>\n    </tbody></table>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#141718;padding-top:10px;\">NCRFU now runs three Men's+ tiers; Tier 1 is the hybrid tier for Nationals qualification. The non-league side schedule is still being worked on. For NorAm, plan to land in New Orleans by Friday at the latest — Thursday is better so you can acclimate. More details to come.</div>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n      <tbody><tr><td style=\"background-color:#00243C;padding:32px 36px;\">\n        <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:16px;line-height:22px;letter-spacing:1.5px;color:#24A0F1;\">FROM THE ARCHIVES: 25 YEARS</div>\n        <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#DCDDDE;padding-top:12px;\">\n          This September 11 marks <span style=\"font-weight:bold;color:#FEFEFE;\">25 years</span> since Mark Bingham — Fog player, and one of the passengers who fought back on United 93 — was killed. The club had only just been admitted to NCRFU that spring. In 2002 the Fog created the Mark Kendall Bingham Memorial Tournament in his name and won the first one, right here in San Francisco, 27–5 over the Kings Cross Steelers. It's now the biggest amateur rugby tournament in the world, and you were just at it.\n        </div>\n        <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#DCDDDE;padding-top:12px;\">\n          Mark's line still holds: <span style=\"font-style:italic;color:#FEFEFE;\">&ldquo;We have the chance to be role models for other gay folks who wanted to play sports, but never felt good enough or strong enough.&rdquo;</span> Raise a glass with us at the Pilsner Inn on Sep 11.\n        </div>\n        <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#DCDDDE;padding-top:12px;\">\n          And one more date for the diary: on <span style=\"font-weight:bold;color:#FEFEFE;\">October 14, 2000</span>, nine people turned up to the Fog's first-ever practice. This October 14 the club turns 26. Pollo, our Director of Antiquities, is digging through the archives for more — send him your old photos, kits and stories.\n        </div>\n      </td></tr>\n    </tbody></table>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n      <tbody><tr><td style=\"border-left:4px solid #006EB6;padding:6px 0 6px 24px;\">\n        <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:16px;line-height:22px;letter-spacing:1.5px;color:#00243C;\">REST, RECOVER — AND MOVE</div>\n        <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:12px;\">\n          Attached is a <span style=\"font-weight:bold;\">daily mobility routine</span> from <span style=\"font-weight:bold;\">Rob Bascherini</span> that you can knock out in under 10 minutes. Do it in the morning — or at minimum before you train. Better joint range of motion means more flexibility, more strength, and fewer of us on the physio table. It's a core pillar of pre-hab, so start now and it'll be habit by the time preseason kicks off.\n        </div>\n      </td></tr>\n    </tbody></table>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n      <tbody><tr><td style=\"background-color:#DCDDDE;padding:28px 32px;\">\n        <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:18px;line-height:24px;letter-spacing:1.5px;color:#00243C;\">WE NEED YOUR HANDS</div>\n        <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:12px;\">\n          Three events this fall run on volunteers: the <span style=\"font-weight:bold;\">Magnitude coat check</span> (Sep 26), the <span style=\"font-weight:bold;\">Folsom sunscreen booth</span> (Sep 27) and the <span style=\"font-weight:bold;\">Eagle Beer Bust</span> (date TBD). They're fun shifts, they fund the club, and they go fast. To grab a spot, reach out to <span style=\"font-weight:bold;\">Justice</span>, our Director of Fundraising.\n        </div>\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-top:18px;\">\n          <tbody><tr><td style=\"background-color:#006EB6;border-radius:3px;\">\n            <a href=\"mailto:INSERT-JUSTICE-EMAIL@fogrugby.com\" style=\"display:block;padding:12px 28px;font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:14px;line-height:18px;letter-spacing:1.5px;color:#FEFEFE;text-decoration:none;\">VOLUNTEER WITH JUSTICE</a>\n          </td></tr>\n        </tbody></table>\n      </td></tr>\n    </tbody></table>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:18px;line-height:24px;letter-spacing:1.5px;color:#006EB6;border-bottom:1px solid #DCDDDE;padding-bottom:10px;\">KIT AND EQUIPMENT RETURN</div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:16px;\">\n      Getting a full set of club equipment to Brisbane and home again is no small job. Huge thanks to <span style=\"font-weight:bold;\">Bryan</span> for coordinating every bag, ball and cone across the Pacific and back.\n    </div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:12px;\">\n      If you still have club kit at home — tackle bags, balls, cones, med kit, jerseys — please get it back to Bryan before Oct 29 so we start preseason with a full store. No questions asked; we'd just rather find it in the shed than buy it twice.\n    </div>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 8px 40px;\">\n    <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:18px;line-height:24px;letter-spacing:1.5px;color:#006EB6;border-bottom:1px solid #DCDDDE;padding-bottom:10px;\">PATHWAYS TO RUGBY: EVERY. BODY.</div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:16px;\">\n      Pathways to Rugby is our free, zero-experience-required intro to the sport, built on a simple idea: there are <span style=\"font-weight:bold;color:#006EB6;\">positions for EVERY body</span>. No matter your size, fitness or experience, there's a spot on the pitch.\n    </div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:12px;\">\n      Sessions run <span style=\"font-weight:bold;\">Sep 22 at Crocker</span> and from <span style=\"font-weight:bold;\">Oct 6 at Kimball</span>. The single most useful thing you can do for the club this month is bring one person who's never played. Send them to <a href=\"https://www.fogrugby.com/p2r\" style=\"color:#006EB6;text-decoration:underline;\">fogrugby.com/p2r</a> or just bring them along — water, cleats if they have them, and you.\n    </div>\n  </td></tr>\n\n  <tr><td class=\"px\" style=\"background-color:#FEFEFE;padding:40px 40px 40px 40px;\">\n    <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:18px;line-height:24px;letter-spacing:1.5px;color:#006EB6;border-bottom:1px solid #DCDDDE;padding-bottom:10px;\">FRESH PAINT ON THE WEBSITE</div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:16px;\">\n      The site is updated for the 2026–27 season: refreshed copy, the NorAm 2025 highlights, the new board and squad pages, and the Pathways details. <a href=\"https://www.fogrugby.com\" style=\"color:#006EB6;text-decoration:underline;\">Take a look</a> and tell us what you think — and if you want to relive Brisbane, the <a href=\"https://INSERT-PHOTO-FOLDER-LINK\" style=\"color:#006EB6;text-decoration:underline;\">team photo folder</a> is open, or search <span style=\"font-weight:bold;\">#fogatbingham</span>.\n    </div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:28px;\">\n      Enjoy the break. You've earned it — and there's a lot to look forward to.\n    </div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#141718;padding-top:12px;\">See you on the pitch,</div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#141718;font-weight:bold;padding-top:6px;\">Justin Melbourne</div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;letter-spacing:1px;color:#006EB6;\">PRESIDENT, SAN FRANCISCO FOG RFC</div>\n  </td></tr>\n\n  <!-- Footer -->\n  <tr><td class=\"px\" style=\"background-color:#00243C;padding:28px 40px;\" align=\"center\">\n    <div style=\"font-family:Futura,'Trebuchet MS',Arial,sans-serif;font-weight:bold;font-size:13px;line-height:18px;letter-spacing:2px;color:#FEFEFE;\">SAN FRANCISCO FOG RFC</div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#DCDDDE;padding-top:10px;\">\n      <a href=\"https://www.fogrugby.com\" style=\"color:#24A0F1;text-decoration:underline;\">fogrugby.com</a>\n    </div>\n    <div style=\"font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:17px;color:#DCDDDE;padding-top:14px;\">\n      You're receiving this because you're part of the Fog Family — players, supporters, and friends of the club.<br>\n      San Francisco Fog RFC · [INSERT POSTAL ADDRESS] · San Francisco, CA<br>\n      <a href=\"https://INSERT-UNSUBSCRIBE-LINK\" style=\"color:#24A0F1;text-decoration:underline;\">Unsubscribe</a>\n    </div>\n  </td></tr>\n\n  <!-- Progress flag rule bottom -->\n  <tr><td>\n    <table role=\"pr
