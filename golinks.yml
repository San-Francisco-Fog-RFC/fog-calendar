# Hand-made short links served at https://events.fogrugby.com/go/<slug>/
# Use these for QR codes, flyers and posters. build_ics.py renders each one as a
# redirect page that fires a GA4 `go_link_click` event, then forwards with UTMs.
# Slugs must be lowercase letters, digits and hyphens, and never all digits
# (numeric folders are reserved for CiviCRM event RSVP pages).
#
# Fields:
#   url       destination (required)
#   title     shown on the "Taking you to..." fallback page
#   campaign  utm_campaign (defaults to the slug)
#   source    utm_source (default: qr)
#   medium    utm_medium (default: print)

links:
  jingle-ball:
    title: Jingle Balls Out! Ball
    url: https://forbiddentickets.com/events/san-francisco-fog-rugby/370331a7da
    campaign: jingle-ball-2026
    source: qr
    medium: print
