# Event promotion settings for promote.py. Listing copy lives in events.yml, under each series' `listing:`.
#
#   uv run promote.py plan                      what's been submitted where, and what's due
#   uv run promote.py fill <listing> <site>     open the site's form in a browser and fill it in; you click Submit
#   uv run promote.py kit <listing> <site>      print copy-paste fields for sites without a filler
#   uv run promote.py mark <listing> <site> ... record a status change (e.g. published, with the live link)
#
# Sites: funcheap, scruff, thegaycalendar, dothebay, eventbrite, plai, google

contact:
  name: San Francisco Fog RFC
  email: clubhouse@fogrugby.com          # default; a listing can override with its own `contact:`
  organization: San Francisco Fog Rugby Football Club

eventbrite:
  organization_id: "3015535079476"   # San Francisco Fog Rugby Football Club
  organizer_id: "121791402523"
  capacity: 100                      # free registrations per event
