name: Build calendar feeds

on:
  push:
    branches: [main]
    paths: ["events.yml", "build_ics.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 build_ics.py
      - name: Commit generated calendar
        run: |
          git config user.name "fog-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/fog.ics docs/events.json docs/schema-events.jsonld docs/openapi.yaml docs/index.html
          git diff --cached --quiet || git commit -m "build: regenerate calendar feeds and schema markup"
          git push
