      summary: A free crash course in rugby for people who have never played, run by San Francisco's inclusive LGBTQ+ rugby club.
      description: |
        Pathway to Rugby is a crash course for people who have never played. Guided practices on Tuesdays and Thursdays throughout October, built so each session picks up where the last one left off.

        Over the sessions you'll cover:
        - Passing and catching
        - Running with the ball, in attack and defence
        - Tackling and contact — safely, and not until week two
        - Rucking
        - Putting it together in a game

        No experience required, and we mean that literally — most of the people standing next to you will be in exactly the same position.

        Check-in from 7:30pm; sessions run until 10pm. Questions? Email recruiting@fogrugby.com
