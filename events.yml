# San Francisco Fog RFC — club calendar (single source of truth for fog.ics)
#
# SOURCES
#   • "SF Fog 2026–2027 Season Update" — Dany Samreth → players@ / FogRookies@, 2 Sep 2026 (preseason, league, playoffs, NorAm)
#   • "Rucktacular 2026 SAN DIEGO" — Danny Jimenez (SD Armada) → club presidents, 3 Sep 2026 + weekend schedule graphic
#   • Pathway to Rugby 2026 and 9/11 toast details — President, 3 Sep 2026
#
# HOW TO ADD/EDIT:  one entry per event. Commit to main → GitHub Action rebuilds docs/fog.ics.
# Times are America/Los_Angeles. Leave `time:` out for all-day / TBD-kickoff events.
# Location convention for matches: home = "San Francisco"; away = "TBC - <City>" until the venue is confirmed.
#
# Fields:
#   id        stable slug, never change once published (it's the calendar UID)
#   title     what shows on the calendar
#   date      YYYY-MM-DD           (or multi-day: start: YYYY-MM-DD, end: YYYY-MM-DD — end is inclusive)
#   time      HH:MM (24h, optional) end_time: HH:MM (optional, default +2h)
#   location  free text
#   category  fixture | training | pathway | tournament | social | board | community
#   status    confirmed | tentative
#   notes     description text (optional)
#   url       link (optional)
#   rrule     RFC5545 RRULE for repeating events (optional)
#   exdates   list of YYYY-MM-DD to skip within a repeating event (optional)

calendar_name: SF Fog Rugby
calendar_url: https://www.fogrugby.com/season-fixtures-results

events:

